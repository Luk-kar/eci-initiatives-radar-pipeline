<div class="kpi-row">
      <div class="kpi-card"
           role="button"
           tabindex="0"
           title="Scroll to Total Initiatives list"
           style="cursor:pointer;"
           onclick="scrollToSection('total-initiatives-list-slot')"
           onkeydown="if(event.key==='Enter'||event.key===' ')scrollToSection('total-initiatives-list-slot')">
        <span class="kpi-label">📋 Total Initiatives:</span>
        <span class="kpi-value" style="color:#2A3F69">51</span>
      </div>
      <div class="kpi-card"
           role="button"
           tabindex="0"
           title="Scroll to Collection Ongoing list"
           style="cursor:pointer;"
           onclick="scrollToSection('currently-open-list-slot')"
           onkeydown="if(event.key==='Enter'||event.key===' ')scrollToSection('currently-open-list-slot')">
        <span class="kpi-label">🗳️ Collection Ongoing:</span>
        <span class="kpi-value" style="color:#3779BA">13</span>
      </div>
      <div class="kpi-card"
           role="button"
           tabindex="0"
           title="Scroll to Reached 1M Signatures list"
           style="cursor:pointer;"

           onkeydown="if(event.key==='Enter'||event.key===' ')scrollToSection('reached-signatures-list-slot')">
        <span class="kpi-label">✅ Reached 1M Signatures:</span>

      </div>
      <div class="kpi-card"
           role="button"
           tabindex="0"
           title="Scroll to Got EU Response list"

      </div>
      <div class="kpi-card"
           role="button"
           tabindex="0"
           title="Scroll to Law Passed list"
           style="cursor:pointer;"
           onclick="scrollToSection('led-to-legislation-list-slot')"
           onkeydown="if(event.key==='Enter'||event.key===' ')scrollToSection('led-to-legislation-list-slot')">
        <span class="kpi-label">⚖️ Law Passed:</span>
        <span class="kpi-value" style="color:#3CA371">2</span>
      </div>
