<div>                            <div id="chart-top10-signatures" class="plotly-graph-div" style="height:400px; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("chart-top10-signatures")) {                    Plotly.newPlot(                        "chart-top10-signatures",                        [{"customdata":[[12.0,"Prohibit the import, export, sale, and offer for sale of\u003cbr\u003eloose shark fins and all products containing shark fins\u003cbr\u003eother than fins naturally attached to the shark's body in\u003cbr\u003ethe European Union.","The Commission is conducting an impact assessment to\u003cbr\u003eevaluate extending the 'fins naturally attached' policy to\u003cbr\u003eimports and exports. A legislative proposal addressing the\u003cbr\u003eshark fin trade is expected within the current mandate.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fstop-finning-stop-the-trade_en",2022],[11.0,"Abrogate Directive 2010\u002f63\u002fEU on the protection of animals\u003cbr\u003eused for scientific purposes and re-direct EU research\u003cbr\u003etowards human-biology-based sciences.","The Commission, while acknowledging public concern over\u003cbr\u003eanimal testing, concluded that an immediate abrogation of\u003cbr\u003eDirective 2010\u002f63\u002fEU would be counterproductive. It\u003cbr\u003ecommitted to further implementation of the 3Rs principle\u003cbr\u003e(Replace, Reduce, Refine) and to promoting the development\u003cbr\u003eof alternative methods.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fstop-vivisection_en",2012],[12.0,"Adopt a set of legal acts to improve the protection of\u003cbr\u003epersons belonging to national and linguistic minorities and\u003cbr\u003estrengthen cultural and linguistic diversity in the EU.","The Commission acknowledged the importance of minority\u003cbr\u003erights but concluded that the proposed measures exceeded its\u003cbr\u003elegislative competence in several areas. It committed to\u003cbr\u003emonitoring compliance with fundamental rights standards in\u003cbr\u003emember states and to supporting minority languages through\u003cbr\u003eexisting funding programmes.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fminority-safepack_en",2013],[14.0,"Propose legislation to phase out and ultimately prohibit the\u003cbr\u003euse of cages for farmed animals including laying hens,\u003cbr\u003erabbits, pullets, broiler breeders, layer breeders, quail,\u003cbr\u003educks and geese.","The Commission commits to propose legislation to phase out\u003cbr\u003eand ban the use of cages for all animals listed in the\u003cbr\u003einitiative by 2027, in line with the Farm to Fork Strategy\u003cbr\u003eobjectives and following a thorough impact assessment.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fend-cage-age_en",2023],[16.0,"Ban the farming of animals for their fur across all EU\u003cbr\u003emember states and prohibit the import and export of fur and\u003cbr\u003efur products into and from the EU.","The Commission acknowledges the citizens' concerns regarding\u003cbr\u003eanimal welfare in fur farming. It will assess the\u003cbr\u003efeasibility of an EU-wide ban in the context of the upcoming\u003cbr\u003erevision of the Animal Welfare legislation and the Farm to\u003cbr\u003eFork Strategy.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002ffur-free-europe_en",2024],[18.0,"Recognise access to safe drinking water and sanitation as a\u003cbr\u003ehuman right, exclude water services from internal market\u003cbr\u003erules and liberalisation, and strengthen EU efforts to\u003cbr\u003eachieve universal access to water and sanitation.","Following the European Citizens' Initiative 'Right2Water',\u003cbr\u003ethe Commission carried out a public consultation and adopted\u003cbr\u003ea Communication reaffirming the commitment that water is a\u003cbr\u003epublic good and a human right. The revised Drinking Water\u003cbr\u003eDirective adopted in 2020 strengthens the universal access\u003cbr\u003eobligation.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fright-to-water_en",2024],[13.0,"Implement the human right to water and sanitation as\u003cbr\u003erecognised by the United Nations, and promote the provision\u003cbr\u003eof water and sanitation as essential public services for\u003cbr\u003eall.","The Commission adopted a Communication responding to the\u003cbr\u003eRight2Water initiative, committing to assess and reinforce\u003cbr\u003eimplementation of EU water legislation and to ensure\u003cbr\u003euniversal access to safe drinking water. It also launched a\u003cbr\u003epublic consultation on the Drinking Water Directive.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fright2water_en",2012],[19.0,"Prohibit the EU from financing activities which presuppose\u003cbr\u003ethe destruction of human embryos in particular in the areas\u003cbr\u003eof research development aid and public health.","The organizers formally withdrew the initiative before the\u003cbr\u003eCommission issued a substantive response. The withdrawal was\u003cbr\u003esubmitted to the Secretariat-General and the initiative was\u003cbr\u003eclosed without a Commission Communication being adopted.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fone-of-us_en",2021],[18.0,"Prohibit the EU from financing activities which presuppose\u003cbr\u003ethe destruction of human embryos, in particular in the areas\u003cbr\u003eof research, development aid and public health.","The Commission concluded that the existing legal framework\u003cbr\u003egoverning EU funding in the areas of research, development\u003cbr\u003eaid and public health already contains adequate safeguards.\u003cbr\u003eIt did not consider it appropriate to amend the relevant\u003cbr\u003eregulations as requested.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fone-of-us-embryo_en",2014],[23.0,"Request the Council to repeal the negotiating mandate for\u003cbr\u003eTTIP and not to conclude CETA, due to concerns over\u003cbr\u003eregulatory standards, investor-state dispute settlement, and\u003cbr\u003edemocratic accountability.","The organizers withdrew the initiative after the Commission\u003cbr\u003edeclined to register it under the ECI procedure. The\u003cbr\u003einitiative subsequently gathered signatures outside the\u003cbr\u003eofficial framework. TTIP negotiations were later suspended.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fstop-ttip_en",2014]],"hovertemplate":"\u003cb\u003e%{y}\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003eYear:\u003c\u002fb\u003e %{customdata[4]}\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSignatures:\u003c\u002fb\u003e %{x:,.0f}\u003cbr\u003e\u003cb\u003eCountries Threshold Met:\u003c\u002fb\u003e %{customdata[0]}\u002f27\u003cbr\u003e\u003cbr\u003e\u003cb\u003eObjective:\u003c\u002fb\u003e\u003cbr\u003e%{customdata[1]}\u003cbr\u003e\u003cbr\u003e\u003cb\u003eCommission Response:\u003c\u002fb\u003e\u003cbr\u003e%{customdata[2]}\u003cbr\u003e\u003cbr\u003e\u003ci\u003e\ud83d\udd17 Click to open initiative page\u003c\u002fi\u003e\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":["rgb(177,213,126)","rgb(174,211,125)","rgb(172,211,125)","rgb(162,206,124)","rgb(156,204,123)","rgb(148,200,122)","rgb(135,195,121)","rgb(135,195,121)","rgb(135,195,121)","rgb(60,163,113)"],"line":{"color":"white","width":0.5}},"orientation":"h","showlegend":false,"x":{"dtype":"f8","bdata":"AAAAAPwWMUEAAAAAiuYxQQAAAAClijJBAAAAAHlRNUEAAAAAb+w2QQAAAACXUjlBAAAAAHbCPEEAAAAAdPQ8QQAAAAB09DxBAAAAgKAOSUE="},"y":["Stop Finning - Stop the Trade","Stop Vivisection","Minority SafePack","End the Cage Age","Fur Free Europe","Right to Water","Right2
