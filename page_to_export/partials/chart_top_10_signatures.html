<div>                            <div id="chart-top10-signatures" class="plotly-graph-div" style="height:400px; width:100%;"></div>            <script type="text/javascript">                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("chart-top10-signatures")) {                    Plotly.newPlot(                        "chart-top10-signatures",                        [{"customdata":[[2,"Strengthen EU external border controls and establish a\u003cbr\u003epermanent EU border protection force with enhanced mandate\u003cbr\u003eto prevent illegal crossings and ensure the security of\u003cbr\u003emember states' territorial integrity.","The Commission is reviewing the initiative. Border\u003cbr\u003emanagement is a shared competence and Frontex has been\u003cbr\u003esignificantly reinforced. The Commission will assess whether\u003cbr\u003efurther legislative or operational measures are warranted in\u003cbr\u003ethe context of the Pact on Migration and Asylum.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fprotect-eu-borders_en"],[5,"Ensure that AI systems used in employment contexts are\u003cbr\u003esubject to human oversight, algorithmic transparency, and\u003cbr\u003eworkers' right to explanation for any automated decision\u003cbr\u003eaffecting their employment conditions.","The Commission is reviewing the submitted request. Under the\u003cbr\u003eAI Act, high-risk AI systems used in employment are subject\u003cbr\u003eto transparency and human oversight requirements. Further\u003cbr\u003emeasures to strengthen workers' rights are under\u003cbr\u003econsideration.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fai-regulation-workers_en"],[8,"Introduce a progressive EU-wide net wealth tax on\u003cbr\u003eindividuals holding assets above \u20ac1 million to fund the\u003cbr\u003egreen transition, reduce inequality, and finance public\u003cbr\u003eservices across member states.","The Commission is reviewing the initiative. Tax policy\u003cbr\u003eremains primarily a member state competence. The Commission\u003cbr\u003ewill explore whether EU-level coordination mechanisms on\u003cbr\u003ewealth taxation can complement existing anti-avoidance\u003cbr\u003eframeworks.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002ftax-the-rich_en"],[11,"Restore biodiversity and transition to nature-friendly\u003cbr\u003efarming by reducing synthetic pesticide use by 80% by 2030\u003cbr\u003eand restoring natural ecosystems on at least 10% of\u003cbr\u003eagricultural land.","The Commission confirms its commitment to reduce chemical\u003cbr\u003epesticide use and risk by 50% and more hazardous pesticides\u003cbr\u003eby 50% by 2030, as set out in the Farm to Fork and\u003cbr\u003eBiodiversity Strategies, and will present a legislative\u003cbr\u003eproposal accordingly.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fsave-bees-and-farmers_en"],[12,"Prohibit the import, export, sale, and offer for sale of\u003cbr\u003eloose shark fins and all products containing shark fins\u003cbr\u003eother than fins naturally attached to the shark's body in\u003cbr\u003ethe European Union.","The Commission is conducting an impact assessment to\u003cbr\u003eevaluate extending the 'fins naturally attached' policy to\u003cbr\u003eimports and exports. A legislative proposal addressing the\u003cbr\u003eshark fin trade is expected within the current mandate.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fstop-finning-stop-the-trade_en"],[14,"Propose legislation to phase out and ultimately prohibit the\u003cbr\u003euse of cages for farmed animals including laying hens,\u003cbr\u003erabbits, pullets, broiler breeders, layer breeders, quail,\u003cbr\u003educks and geese.","The Commission commits to propose legislation to phase out\u003cbr\u003eand ban the use of cages for all animals listed in the\u003cbr\u003einitiative by 2027, in line with the Farm to Fork Strategy\u003cbr\u003eobjectives and following a thorough impact assessment.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fend-cage-age_en"],[16,"Ban the farming of animals for their fur across all EU\u003cbr\u003emember states and prohibit the import and export of fur and\u003cbr\u003efur products into and from the EU.","The Commission acknowledges the citizens' concerns regarding\u003cbr\u003eanimal welfare in fur farming. It will assess the\u003cbr\u003efeasibility of an EU-wide ban in the context of the upcoming\u003cbr\u003erevision of the Animal Welfare legislation and the Farm to\u003cbr\u003eFork Strategy.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002ffur-free-europe_en"],[18,"Recognise access to safe drinking water and sanitation as a\u003cbr\u003ehuman right, exclude water services from internal market\u003cbr\u003erules and liberalisation, and strengthen EU efforts to\u003cbr\u003eachieve universal access to water and sanitation.","Following the European Citizens' Initiative 'Right2Water',\u003cbr\u003ethe Commission carried out a public consultation and adopted\u003cbr\u003ea Communication reaffirming the commitment that water is a\u003cbr\u003epublic good and a human right. The revised Drinking Water\u003cbr\u003eDirective adopted in 2020 strengthens the universal access\u003cbr\u003eobligation.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fright-to-water_en"],[19,"Prohibit the EU from financing activities which presuppose\u003cbr\u003ethe destruction of human embryos in particular in the areas\u003cbr\u003eof research development aid and public health.","The organizers formally withdrew the initiative before the\u003cbr\u003eCommission issued a substantive response. The withdrawal was\u003cbr\u003esubmitted to the Secretariat-General and the initiative was\u003cbr\u003eclosed without a Commission Communication being adopted.","https:\u002f\u002fcitizens-initiative.europa.eu\u002finitiatives\u002fone-of-us_en"]],"hovertemplate":"\u003cb\u003e%{y}\u003c\u002fb\u003e\u003cbr\u003e\u003cbr\u003e\u003cb\u003eSignatures:\u003c\u002fb\u003e %{x:,.0f}\u003cbr\u003e\u003cb\u003eCountries Threshold Met:\u003c\u002fb\u003e %{customdata[0]}\u002f27\u003cbr\u003e\u003cbr\u003e\u003cb\u003eObjective:\u003c\u002fb\u003e\u003cbr\u003e%{customdata[1]}\u003cbr\u003e\u003cbr\u003e\u003cb\u003eCommission Response:\u003c\u002fb\u003e\u003cbr\u003e%{customdata[2]}\u003cbr\u003e\u003cbr\u003e\u003ci\u003e\ud83d\udd17 Click to open initiative page\u003c\u002fi\u003e\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"color":["rgb(202,87,67)","rgb(222,146,71)","rgb(248,224,77)","rgb(176,212,126)","rgb(167,208,125)","rgb(129,192,120)","rgb(114,186,119)","rgb(92,177,116)","rgb(60,163,113)"],"line":{"color":"white","width":0.5}},"orientation":"h","x":{"dtype":"i4","bdata":"tNYBANDdBgCQlA0AcBYQAPwWEQB5URUAb+wWAJdSGQB09BwA"},"y":["Protect EU Borders","AI Regulation for Workers","Tax the Rich","Save Bees and Farmers","Stop Finning - Stop the Trade","End the Cage Age","Fur Free Europe","Right to Water","One of Us"],"type":"bar"}],                        {"template":{"data":{"histogram2dcontour":[{"type":"histogram2dcontour","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#ed7953"],[0.7777777777777778,"#fb9f3a"],[0.8888888888888888,"#fdca26"],[1.0,"#f0f921"]]}],"choropleth":[{"type":"choropleth","colorbar":{"outlinewidth":0,"ticks":""}}],"histogram2d":[{"type":"histogram2d","colorbar":{"outlinewidth":0,"ticks":""},"colorscale":[[0.0,"#0d0887"],[0.1111111111111111,"#46039f"],[0.2222222222222222,"#7201a8"],[0.3333333333333333,"#9c179e"],[0.4444444444444444,"#bd3786"],[0.5555555555555556,"#d8576b"],[0.6666666666666666,"#
