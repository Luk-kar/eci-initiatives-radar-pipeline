<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ECI Dashboard POC</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<link rel="stylesheet" href="./styles/styles.css">

<body>
  <div class="dashboard-container" id="top">

    <div id="header-slot"></div>
    <div id="footer-slot"></div>
    <div id="kpi-row-slot"></div>

    <div class="table-curently-open-slot">
      <div id="list-currently-open-slot"></div>
    </div>

    <div class="row-top-10-graph">
      <div id="chart-top-10-signatures-slot"></div>
    </div>

    <div class="move-top-page">
      <button id="back-to-top" class="back-to-top-btn" aria-label="Scroll to top" title="Back to top">
        &#8963;
      </button>
    </div>

    <div class="bottom-row">
      <div id="chart-outcomes-slot"></div>
      <div id="chart-signatures-cohorts-slot"></div>
    </div>

  </div>

  <script src="./script/back_to_top.js"></script>
  <script src="./script/elements/static.js"></script>
  <script src="./script/elements/generated.js"></script>
  <script src="./script/partials.js"></script>
</body>
</html>
