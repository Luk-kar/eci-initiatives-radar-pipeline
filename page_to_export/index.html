<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ECI Dashboard POC</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<link rel="stylesheet" href="./styles/styles.css">

<body>
  <div class="dashboard-container" id="top">

    <div id="header-slot"></div>

    <a
      href="https://citizens-initiative.europa.eu/_en"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="./images/eci_take_initiative_banner.png"
        alt="European Citizens' Initiative — Take the Initiative"
        class="eci-banner"
      />
    </a>
    
    <div id="footer-slot"></div>

    <blockquote class="eci-definition">
      An ECI is a formal mechanism allowing EU citizens to propose legislation
      if they collect 1 million signatures from at least 7 different member
      states within (in most cases) 12 months.
    </blockquote>

    <div id="kpi-row-slot"></div>

    <div class="table-curently-open-slot">
      <div id="list-currently-open-slot"></div>
    </div>

    <div class="row-top-10-graph">
      <div id="chart-top-10-signatures-slot"></div>
    </div>

    <div class="move-top-page">
      <button id="back-to-top" class="back-to-top-btn" aria-label="Scroll to top" title="Back to top">
        &#8963;
      </button>
    </div>

    <div class="row-top-10-graph">
    <div id="chart-signatures-map-slot"></div>
  </div>
  
    <div class="bottom-row">
      <div id="chart-signatures-cohorts-slot"></div>
      <div id="chart-outcomes-slot"></div>
    </div>
    
    <div class="row-top-10-graph">
      <div id="chart-bubble-finance-plot-slot"></div>
    </div>
    
    <div class="row-top-10-graph">
      <div id="chart-ecis-year-slot"></div>
    </div>

    <div id="total-initiatives-list-slot"></div>
    <div id="currently-open-list-slot"></div>
    <div id="reached-signatures-list-slot"></div>
    <div id="got-response-list-slot"></div>
    <div id="led-to-legislation-list-slot"></div>

  <script src="./script/back_to_top.js"></script>
  <script src="./script/elements/static.js"></script>
  <script src="./script/elements/generated.js"></script>
  <script src="./script/partials.js"></script>
  <script src="./script/move_to_section.js"></script>
</body>
</html>
