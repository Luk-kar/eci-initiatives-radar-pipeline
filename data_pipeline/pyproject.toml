[project]
name = "eci-data-pipeline"
version = "0.1.0"
description = "Web scraping pipeline for European Citizens' Initiatives (ECI) data."
readme = "../README.ECI_initiatives.md"
requires-python = ">=3.10"

dependencies = [
  "selenium==4.35.0",
  "beautifulsoup4==4.13.5",
  "pydantic==2.12.5",
  "html5lib==1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
eci-scrape-initiatives = "data_pipeline.scraper.initiatives.__main__:scrape_eci_initiatives"
eci-scrape-responses = "data_pipeline.scraper.responses.main:scrape_commission_responses"
eci-scrape-followup = "data_pipeline.scraper.responses_followup.main:scrape_followup_websites"
eci-extract-legislation = "data_pipeline.merger_csv.responses_followup.__main__:main"

[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["data_pipeline*"]

[tool.pytest.ini_options]
pythonpath = [".."]
addopts = "-m 'not e2e'"
markers = [
    "e2e: live end-to-end tests against the EU server (require network access)",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
venv = ".venv.data_pipeline"