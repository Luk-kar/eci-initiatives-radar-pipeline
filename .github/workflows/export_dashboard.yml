name: Export Dashboard to Data Repo

on:
  workflow_dispatch:  # Allows you to run this manually from the Actions tab
  # schedule:
  #   - cron: '0 2 * * 1'  # Optional: Run automatically every Monday at 2:00 AM

jobs:
  export-and-pr:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the Logic Repo (Source)
      - name: Checkout Pipeline Repo
        uses: actions/checkout@v4
        with:
          path: pipeline-repo

      # --- Placeholder: Run your Python generation script here ---
      # - name: Setup uv and run pipeline
      #   run: |
      #     cd pipeline-repo
      #     curl -LsSf https://astral.sh/uv/install.sh | sh
      #     uv run run_pipeline.sh
      # -----------------------------------------------------------

      # 2. Checkout the Data Repo (Target) using a Personal Access Token
      - name: Checkout Dashboard Repo
        uses: actions/checkout@v4
        with:
          repository: Luk-kar/eci-initiatives-radar-dashboard
          token: ${{ secrets.DASHBOARD_REPO_PAT }}
          path: dashboard-repo

      # 3. Copy the generated index.html to the Dashboard Repo root
      - name: Copy index.html to Target
        run: |
          # The prompt requested `./index.html`, which matches the root in your tree.
          # If it is generated inside `page_to_export/`, change the source path accordingly.
          cp pipeline-repo/index.html dashboard-repo/index.html
          
          # Optional: Also copy the CSV artifacts if your dashboard needs them dynamically
          # cp pipeline-repo/local_artifacts/*.csv dashboard-repo/data/ || true

      # 4. Create the Pull Request in the Dashboard Repo
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          path: dashboard-repo
          token: ${{ secrets.DASHBOARD_REPO_PAT }}
          commit-message: "Update dashboard index.html from pipeline"
          committer: "GitHub Actions Bot <actions@github.com>"
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: "update-dashboard-html" # This branch is created in the dashboard repo
          delete-branch: true             # Deletes the branch after PR is merged
          title: "🚀 Update Dashboard UI"
          body: |
            Automated Pull Request generated by the `eci-initiatives-radar-pipeline` repository.
            
            This updates the root `index.html` with the latest generated charts and data.
          base: "main"
          labels: "automated pr"
